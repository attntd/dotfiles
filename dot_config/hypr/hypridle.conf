general {
    # Wait for Hyprland's native lock notification, including with our wrapper.
    # logind still limits this delay to InhibitDelayMaxSec (currently 5 seconds).
    inhibit_sleep = 3
    lock_cmd = ~/.config/quickshell/scripts/lock-screen
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# Caffeinate gates only automatic idle events; manual and before-sleep locks
# remain unconditional. The original idle timeouts are preserved.

# Dim the built-in display to 10% after 3 minutes and restore its previous
# brightness as soon as activity resumes.
listener {
    timeout = 180
    on-timeout = ~/.config/quickshell/scripts/caffeinate-idle dim
    on-resume = ~/.config/quickshell/scripts/caffeinate-idle dim-resume
}

# Lock one minute after the displays turn off (6 minutes of inactivity).
listener {
    timeout = 360
    on-timeout = ~/.config/quickshell/scripts/caffeinate-idle lock
}

# Turn the displays off after 5 minutes; activity during the next minute
# restores them without locking the session.
listener {
    timeout = 300
    on-timeout = ~/.config/quickshell/scripts/caffeinate-idle display-off
    on-resume = ~/.config/quickshell/scripts/caffeinate-idle display-resume
}

# Suspend after 15 minutes; systemd will hibernate later according to sleep.conf.
listener {
    timeout = 900
    on-timeout = ~/.config/quickshell/scripts/caffeinate-idle suspend
}
