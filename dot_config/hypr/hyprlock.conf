$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Przyłóż palec żeby odblokow
    fingerprint:present_message = Skanowanie odcisku palca
}

animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
    animation = inputFieldColors, 1, 4, easeOut
    animation = inputFieldFade, 1, 2, easeOut
    animation = inputFieldWidth, 1, 4, easeOut
    animation = inputFieldDots, 1, 2, easeOut
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
}

label {
    monitor =
    text = $TIME
    color = rgba(ffffffff)
    font_size = 96
    font_family = $font

    position = -48, -36
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d.%m.%Y"
    color = rgba(ddddddff)
    font_size = 28
    font_family = $font

    position = -48, -178
    halign = right
    valign = top
}

image {
    monitor =
    path = ~/.config/hypr/putek_mocha_avatar_155.png
    size = 155
    rounding = -1
    border_size = 3
    border_color = rgba(f5c2e7ff) rgba(89b4faff) 45deg

    position = 0, 80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 440, 56
    outline_thickness = 0
    inner_color = rgba(00000000)
    outer_color = rgba(ffffffff)
    check_color = rgba(89b4faff)
    fail_color = rgba(ff3366ee)
    font_color = rgba(ffffffff)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = Wpisz hasło lub zeskanuj odcisk palca
    fail_text = Uwierzytelnienie nieudane
    fade_on_empty = false
    swap_font_color = true
    dots_text_format = <span alpha="1">•</span>
    dots_spacing = 0.25

    position = 0, -60
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 440, 56
    outline_thickness = 3
    inner_color = rgba(00000000)
    outer_color = rgba(f5c2e7ff) rgba(89b4faff) 45deg
    check_color = rgba(89b4faff)
    fail_color = rgba(ff3366ee)
    font_color = rgba(ffffffff)
    font_family = $font
    placeholder_text =
    fail_text =
    fade_on_empty = true
    fade_timeout = 0
    rounding = 14
    dots_spacing = 0.25

    position = 0, -60
    halign = center
    valign = center
    zindex = 1
}
