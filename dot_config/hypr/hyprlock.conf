# Hyprlock 0.9.6. Appearance only; authentication stays in Hyprlock.
# The Putkin launcher supplies the saved accents, motion preference and wallpaper.
$putkinAccent = rgb(cba6f7)
$putkinSecondary = rgb(89b4fa)
$putkinMotion = false
$putkinWallpaper = /home/attntd/.config/hypr/backgrounds/Cloudsnight.jpg
$putkinFont = JetBrainsMono Nerd Font Mono

general {
    hide_cursor = true
}
animations {
    enabled = $putkinMotion
    bezier = linear, 0, 0, 1, 1
    animation = fadeIn, 1, 1.2, linear
    animation = fadeOut, 1, 1.2, linear
    animation = inputField, 0
}
background {
    monitor =
    path = $putkinWallpaper
    color = rgb(1e1e2e)
    blur_passes = 0
}
# A flat overlay dims the actual wallpaper without blurring or scaling it.
shape {
    monitor =
    size = 100%, 100%
    color = rgba(18182588)
    rounding = 0
    border_size = 0
    position = 0, 0
    halign = center
    valign = center
    zindex = 1
}
label {
    monitor =
    text = $TIME
    color = $putkinAccent
    font_size = 64
    font_family = $putkinFont
    position = 0, 110
    halign = center
    valign = center
    zindex = 2
}
label {
    monitor =
    text = cmd[update:60000] date +"%a %d %b"
    color = rgb(cdd6f4)
    font_size = 16
    font_family = $putkinFont
    position = 0, 46
    halign = center
    valign = center
    zindex = 2
}
input-field {
    monitor =
    size = 360, 44
    outline_thickness = 2
    rounding = 0
    outer_color = $putkinAccent
    inner_color = rgb(181825)
    font_color = rgb(cdd6f4)
    check_color = $putkinSecondary
    fail_color = rgb(f38ba8)
    font_family = $putkinFont
    placeholder_text = Hasło…
    fail_text =
    check_text =
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.3
    position = 0, -30
    halign = center
    valign = center
    zindex = 2
}

source = /home/attntd/.config/putkin/hyprlock-auth.conf
