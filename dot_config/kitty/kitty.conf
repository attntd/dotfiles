# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME
#

font_family CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 14

# Play the terminal bell directly: Hyprland does not play the system bell.
enable_audio_bell no
command_on_bell /usr/bin/pw-play /usr/share/sounds/freedesktop/stereo/complete.oga
# Native background transparency keeps terminal text fully opaque.
# Background blur is provided by Hyprland.
background_opacity 0.90
dynamic_background_opacity yes

# Try Fish in Kitty without changing the system login shell.
shell /usr/bin/fish
watcher quickshell-terminal-context.py

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
